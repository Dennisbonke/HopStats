name: CI
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check backend && ruff format --check backend
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  responsive:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare exact master baseline for screenshot comparisons
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/hopstats-before"
          git archive "$BASE_SHA" frontend | tar -x -C "$RUNNER_TEMP/hopstats-before"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/hopstats-before/frontend/node_modules"
          # Shared read-only dependencies, separate Vite optimization caches.
          sed -i 's/defineConfig({/defineConfig({ cacheDir: ".vite-baseline",/' "$RUNNER_TEMP/hopstats-before/frontend/vite.config.ts"
          echo "HOPSTATS_BASELINE_DIR=$RUNNER_TEMP/hopstats-before/frontend" >> "$GITHUB_ENV"
      - name: Verify document palette and chart tooltip theme regressions
        run: npx playwright test --grep 'document and Explorer use the shared semantic palette|Analytics tooltips stay readable' --max-failures=1
      - run: npx playwright test mobile-landscape.spec.ts --max-failures=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-landscape-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright test beer-details.spec.ts --max-failures=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: beer-detail-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright test --grep 'Explorer review fixes' --max-failures=1
      - run: npx playwright test --grep 'native reporting date keyboard' --max-failures=1
      - run: npx playwright test --project=webkit --grep 'touch taps pin|exact sparse.*320px|native reporting dates.*320px' --max-failures=1
      - run: npx playwright test --grep 'advanced Explorer controls|both range handles|Explorer screenshot|shared Button variants' --max-failures=1
      - run: npm run test:responsive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: responsive-playwright-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: { context: ., push: false, platforms: "linux/amd64,linux/arm64" }
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --tag hopstats-smoke .
      - name: Verify API, frontend, and persistent database volume
        shell: bash
        run: |
          set -euo pipefail
          volume="hopstats-smoke-data"
          docker volume create "$volume"
          cleanup() { docker rm -f hopstats-smoke-container >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name hopstats-smoke-container --publish 8000:8000 \
            --env HOPSTATS_DATABASE_URL=sqlite:////data/hopstats.sqlite3 --volume "$volume:/data" hopstats-smoke
          for _ in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/v1/health && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q HopStats
          docker exec hopstats-smoke-container test -s /data/hopstats.sqlite3
          docker rm --force hopstats-smoke-container
          docker run --detach --name hopstats-smoke-container --publish 8000:8000 \
            --env HOPSTATS_DATABASE_URL=sqlite:////data/hopstats.sqlite3 --volume "$volume:/data" hopstats-smoke
          for _ in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/v1/health && break || sleep 1; done
          docker exec hopstats-smoke-container test -s /data/hopstats.sqlite3
  dependency-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Dependabot configuration
        run: ruby -e 'require "yaml"; YAML.load_file(".github/dependabot.yml")'
