[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hopstats"
version = "0.1.0"
description = "Self-hosted Untappd analytics and beer inventory foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.162.0",
  "python-multipart==0.0.32",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
