[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hopstats"
version = "0.1.0"
description = "Self-hosted Untappd analytics and beer inventory foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.6",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.2"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
